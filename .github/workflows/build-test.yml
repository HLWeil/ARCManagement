name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json
      - name: Restore Fable
        run: dotnet tool restore
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install npm dependencies
        run: npm ci
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Install uv
        run: python -m pip install uv==0.13.5
      - name: Install Python dependencies
        run: uv sync --locked --no-install-project --python 3.12
      - name: Test (Ubuntu)
        if: runner.os != 'Windows'
        run: bash ./build.sh RunTests --fail-on-focused-tests
      - name: Test (Windows)
        if: runner.os == 'Windows'
        run: .\build.cmd RunTests --fail-on-focused-tests
