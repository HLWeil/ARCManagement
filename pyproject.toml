[project]
name = "arc-management"
version = "0.0.1"
description = "F# library for managing ARCs (Annotated Research Contexts), published for .NET, JavaScript, and Python."
authors = [{ name = "Heinrich Lukas Weil", email = "weil@rptu.de" }]
requires-python = ">=3.12"
readme = "README.md"
license = "MIT"
keywords = ["fsharp", "fable", "arc", "annotated-research-context", "research-data-management"]
dependencies = ["fable-library==5.22.0"]

[project.urls]
Repository = "https://github.com/HLWeil/ARCManagement"
Issues = "https://github.com/HLWeil/ARCManagement/issues"

[dependency-groups]
dev = ["pytest==9.1.1", "twine==7.0.0"]

[tool.poetry]
packages = [
    { include = "**/*.py", from = "src/ARCManagement", to = "arc_management" }
]
include = [
    { path = "src/ARCManagement/py/**/*.py", format = ["sdist", "wheel"] }
]

[build-system]
requires = ["poetry-core==2.5.0"]
build-backend = "poetry.core.masonry.api"
